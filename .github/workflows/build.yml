name: Build APK Rig Tracer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip source
        run: |
          mkdir source
          unzip -q APK-Rig-Tracer-V1-source.zip -d source
          echo "===== SOURCE ====="
          find source -maxdepth 3 -type f | head -100

      - name: Find project root
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' | head -1)
          echo "PROJECT_ROOT=$PROJECT" >> $GITHUB_ENV
          echo "Project root: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Rig-Tracer-debug
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
